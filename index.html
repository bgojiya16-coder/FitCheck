<meta name="theme-color" content="#FFD90A">
<title>Fit30 – Daily Fitness Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--outer:#DDEBC6;--bg:#F6F7F4;--card:#fff;--ink:#111;--mute:#7C8077;--lime:#D6F29A;--lime2:#B5EE3B;--pink:#FBD5DD;--yel:#FBEBA8;--blue:#CDE7FB;--line:#E9EAE6;--ok:#6DB50E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--outer);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.35}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);padding:14px 16px 120px}
@media(min-width:460px){#app{margin:16px auto;min-height:calc(100vh - 32px);border-radius:34px}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.ttl{text-align:center;flex:1}.ttl b{font-size:22px;font-weight:700;display:block}.ttl small{color:var(--mute);font-size:13px}
.ic{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--card);border-radius:26px;padding:16px;margin-top:12px}
.lime{background:var(--lime)}.pink{background:var(--pink)}.yel{background:var(--yel)}.blue{background:var(--blue)}
h2{font-size:17px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mut{color:var(--mute);font-size:13px}
.big{font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1}
.n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.n small{font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0}
.bar{height:12px;border-radius:12px;background:var(--line);position:relative;overflow:hidden;margin-top:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:var(--lime2);transition:width .5s}
.bar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#c9cbc4 0 3px,#e3e4df 3px 6px)}
.mac{margin-top:12px}.mac .row{align-items:baseline}.mac b{width:40px;font-size:18px}
.mac .bar i.c{background:#F7A8B8}.mac .bar i.f{background:#F5D86A}.mac .bar i.p{background:#8CC8F5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn{background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600}
.btn.sm{padding:8px 14px;border-radius:12px;font-size:13px}.btn.off{background:var(--line);color:var(--mute)}
.pill{background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px;margin-top:10px;width:100%;text-align:left}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:800;transition:.2s}
.task.on .ck{background:var(--lime2);border-color:var(--lime2);color:var(--ink);transform:scale(1.08)}
.tt{flex:1;font-weight:600}.task.on .tt{text-decoration:line-through;color:var(--mute)}

.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}

.c.part{background:var(--lime)}.c.done{background:var(--lime2)}.c.today{box-shadow:inset 0 0 0 2px var(--ink)}.c.sel{background:var(--ink);color:#fff}
.meal{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.nav button{width:52px;height:48px;border-radius:16px;font-size:20px;opacity:.45;line-height:1}
.nav button small{display:block;font-size:10px;margin-top:2px;font-weight:600}
.nav button.on{opacity:1;background:var(--lime)}
.nav .plus{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;opacity:1;font-size:26px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;animation:tst 2.2s forwards}
@keyframes tst{0%{opacity:0;top:0}10%,80%{opacity:1}100%{opacity:0}}

.rect{cursor:pointer}

html,body{overflow-x:hidden}
.nav button{width:48px}.nav button small{font-size:9px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(17,17,17,.38);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sh{background:var(--bg);width:100%;max-width:430px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s;overscroll-behavior:contain}

.ai{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--lime);color:var(--ink);vertical-align:middle}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--lime2);animation:sp .9s linear infinite;margin:18px auto}@keyframes sp{to{transform:rotate(360deg)}}
.fr{background:#fff;border-radius:18px;padding:10px;margin-top:8px}.fr .row input{min-width:0}.fr .mut{display:block;margin-top:6px;font-size:12px}
.thumb{width:38px;height:38px;border-radius:12px;object-fit:cover;flex:none}
.ctr{text-align:center}

<body><div id="app"></div><nav class="nav"><div id="nav"></div></nav><div id="sheet"></div><input id="fCam" type="file" accept="image/*" capture="environment" hidden><input id="fUp" type="file" accept="image/*" hidden><input id="impF" type="file" accept="application/json,.json" hidden>
<script>
const START=new Date(2026,9,2);
const ST=[8000,8000,8500,8500,9000,9000,8000,9000,9000,9500,9500,10000,10000,8500,10000,10000,10000,10000,10000,10500,9000,10000,10000,10500,10000,10500,11000,9000,10000,10000];
const W=['Full Body A','Walking + mobility','Full Body B','Walking','Full Body A','Longer walk','Recovery','Full Body B','Walking','Full Body A','Walking + core','Full Body B','Long walk','Recovery','Full Body A','Walking','Full Body B','Walking + core','Full Body A','Long walk','Recovery','Full Body B','Walking','Full Body A','Walking + core','Full Body B','Long walk','Recovery','Full Body A','Full Body B + measurements'];
const WA='3 rounds: Squats ×15 · Push-ups ×8–15 · Reverse lunges ×10/leg · Glute bridges ×15 · Plank 30–45 sec · Mountain climbers ×20. Rest 45–75 sec.';
const WB='3 rounds: Squats ×15 · Incline/knee push-ups ×10–15 · Bulgarian split squats ×8–10/leg · Backpack rows ×12–15 · Shoulder taps ×20 · Plank 30–45 sec.';
const M=[
['2 moong-dal chilla + 100 g curd + 1 fruit','2 rotis + 1 cup dal + 1 cup sabji + salad','30 g roasted chana + buttermilk','150 g tofu/paneer + 1–2 rotis + vegetables'],
['50 g oats + 250 ml milk + 10 g chia + 1 small banana','1 cup rice + 1 cup rajma + salad + 100 g curd','1 apple/guava + 20 g peanuts','2 rotis + 1 cup dal + 1 cup sabji + salad'],
['2 besan chilla + 100 g curd + 1 fruit','2 rotis + 1 cup chole + 1 cup vegetables + salad','30 g roasted chana + buttermilk','150 g tofu/paneer + vegetables + 1–2 rotis'],
['1.5 cups vegetable poha + 100 g curd + 15 g peanuts','2 rotis + 1 cup dal + 1 cup sabji + salad','1 fruit + 200 ml buttermilk','1 cup soy-chunk curry + 2 rotis + vegetables'],
['2 moong chilla + 100 g curd + 1 fruit','1 cup rice + 1 cup dal + 1 cup sabji + salad','30 g roasted chana + tea/coffee, little sugar','150 g paneer/tofu + 2 rotis + vegetables'],
['50 g oats + 250 ml milk + 10 g chia + 1 fruit','2 rotis + 1 cup rajma/chole + vegetables + curd','1 fruit + 20 g peanuts','1 cup dal + 2 rotis + large salad + vegetables'],
['2 besan/moong chilla + curd','2 rotis or 1 cup rice + dal + sabji + salad','Fruit + roasted chana','Dal/tofu/paneer + vegetables + 1–2 rotis']];
const MT=['Breakfast','Lunch','Snack','Dinner'],MK=[380,550,200,520],MC=[45,75,20,45],MF=[10,12,8,18],MP=[18,24,10,30]; /* rough estimates */
const Q=[['Chai',60,8,2,2],['Roti',100,18,3,3],['Dal 1 cup',180,28,3,10],['Paneer 100 g',265,4,20,18],['Curd 100 g',60,5,3,3],['Banana',105,27,0,1],['Roasted chana 30 g',110,17,2,6],['Buttermilk',40,5,1,2],['Peanuts 20 g',115,3,10,5]];
const KPS=0.04,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=n=>Math.round(n).toLocaleString('en-IN');
let S={days:{},wt:{},set:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem('fit30')))}catch(e){}
function mig(){S.days=S.days||{};S.wt=S.wt||{};S.set=Object.assign({kcal:1800,lo:1700,hi:1900,pro:100,car:200,fat:55,water:2.5,steps:8000},S.set);S.prof=S.prof||{};S.foods=S.foods||[];S.v=2}mig();
const save=()=>{try{localStorage.setItem('fit30',JSON.stringify(S))}catch(e){}};
let sel=new Date();sel.setHours(0,0,0,0);let view='home',cm='kcal',first=true,wipe=false;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const idx=d=>Math.round((d-START)/864e5);
const rec=d=>{const k=key(d);const r=S.days[k]||(S.days[k]={});return Object.assign(r,{steps:r.steps||0,wk:r.wk||0,w:r.w||0,t:r.t||{},food:r.food||[],sl:r.sl||null})};
const peek=d=>S.days[key(d)];
const info=()=>{const i=idx(sel),p=i>=0&&i<30;return{i,p,tgt:p?ST[i]:(S.set.steps||8000),wo:p?W[i]:'Walking',n:((i%7)+7)%7}};
const sum=(r,f)=>r.food.reduce((a,x)=>a+(x[f]||0),0);
const burn=r=>Math.round(r.steps*KPS)+(r.wk||0);
const dn=r=>['steps','wk','meals','water','sleep'].filter(k=>r.t[k]).length;
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)};
function streak(){let n=0,d=today();if(!(peek(d)&&dn(peek(d))>=4))d.setDate(d.getDate()-1);while(peek(d)&&dn(peek(d))>=4){n++;d.setDate(d.getDate()-1)}return n}
function ring(p,a,b){const o=314*(1-Math.min(1,p));return `<svg viewBox="0 0 120 120" width="124" height="124" role="img" aria-label="${Math.round(p*100)} percent"><circle cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="13"/><circle class="arc" cx="60" cy="60" r="50" fill="none" stroke="#8ED11B" stroke-width="13" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="${o}" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#111">${fmt(a)}</text><text x="60" y="76" text-anchor="middle" font-size="12" fill="#555">/ ${fmt(b)}</text></svg>`}
function macros(r){const L=[['Carbs','c','car'],['Fat','f','fat'],['Protein','p','pro']];return L.map(([n,f,t])=>{const v=sum(r,f),T=S.set[t];return `<div class="mac"><div class="row sp"><span class="mut">${n}</span><span><b style="width:auto">${fmt(v)}</b> <span class="mut">/ ${T} g</span></span></div><div class="bar"><i class="${f}" style="width:${Math.min(100,v/T*100)}%"></i></div></div>`}).join('')}
function chart(){const days=[];for(let i=7;i>=0;i--){const d=new Date(sel);d.setDate(d.getDate()-i);days.push(d)}
const val=d=>{const x=peek(d);if(!x)return 0;x.food=x.food||[];return cm==='kcal'?sum(x,'kcal'):cm==='steps'?(x.steps||0):burn(x)};
const v=days.map(val),I=info(),tg=cm==='kcal'?S.set.kcal:cm==='steps'?I.tgt:0,mx=Math.max(...v,tg,1)*1.15;
return `<svg viewBox="0 0 340 160" width="100%" role="img" aria-label="Last 8 days">${tg?`<line x1="0" x2="340" y1="${130-tg/mx*110}" y2="${130-tg/mx*110}" stroke="#aaa" stroke-dasharray="4 4"/>`:''}${days.map((d,i)=>{const h=v[i]/mx*110,s=key(d)===key(sel);return `<g class="rect" data-a="go" data-v="${key(d)}"><rect x="${i*42+6}" y="0" width="34" height="140" fill="transparent"/><rect x="${i*42+10}" y="${130-h}" width="26" height="${Math.max(h,3)}" rx="13" fill="${s?'#B5EE3B':'#E3E4E0'}"/>${v[i]?`<text x="${i*42+23}" y="${122-h}" text-anchor="middle" font-size="10" font-weight="600" fill="#555">${cm==='steps'?(v[i]/1000).toFixed(1)+'k':fmt(v[i])}</text>`:''}<text x="${i*42+23}" y="152" text-anchor="middle" font-size="11" fill="${s?'#111':'#888'}" font-weight="${s?700:400}">${d.getDate()}</text></g>`}).join('')}</svg>`}
function wline(){const k=Object.keys(S.wt).filter(x=>S.wt[x].kg).sort().slice(-14);if(k.length<2)return '<p class="mut" style="margin-top:8px">Log weight on two days to see your trend.</p>';
const v=k.map(x=>S.wt[x].kg),lo=Math.min(...v)-.5,hi=Math.max(...v)+.5;const p=v.map((y,i)=>`${10+i*(320/(v.length-1))},${70-(y-lo)/(hi-lo)*60}`).join(' ');
return `<svg viewBox="0 0 340 80" width="100%" style="margin-top:8px"><polyline points="${p}" fill="none" stroke="#6DB50E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="row sp mut"><span>${v[0]} kg</span><span>${v[v.length-1]} kg (${(v[v.length-1]-v[0]>0?'+':'')+(v[v.length-1]-v[0]).toFixed(1)})</span></div>`}

/* ===== AI integration (no API keys here!) =====
 Set AI.endpoint to YOUR secure backend (it holds the vision-API key). Expected JSON:
 POST {endpoint}/meal  {image:dataURL} -> {foods:[{name,grams,calories,protein,carbs,fat,fiber,sugar,sodium}]}
 POST {endpoint}/label {image:dataURL} -> {name,serving,calories,protein,carbs,fat,fiber,sugar,sodium}
 GET  {endpoint}/barcode?code=123      -> same shape as /label */
const AI={endpoint:''};
const nn=x=>Math.max(0,+x||0),r1=x=>Math.round(x*10)/10;
const normFood=f=>{const g=nn(f.grams)||100;return{n:String(f.name||'Food').slice(0,40),g,g0:g,k:nn(f.calories),p:nn(f.protein),c:nn(f.carbs),f:nn(f.fat),fb:nn(f.fiber),s:nn(f.sugar),so:nn(f.sodium)}};
const normLabel=j=>({name:String(j.name||'Scanned food').slice(0,40),serving:String(j.serving||'1 serving').slice(0,30),kcal:nn(j.calories),p:nn(j.protein),c:nn(j.carbs),f:nn(j.fat),fb:nn(j.fiber),s:nn(j.sugar),so:nn(j.sodium)});
async function callAI(path,opt){if(!AI.endpoint)throw new Error('NO_API');const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);try{const r=await fetch(AI.endpoint.replace(/\/$/,'')+path,Object.assign({signal:c.signal},opt));if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
const post=img=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:img.data})});
async function analyzeMealWithAI(img){const j=await callAI('/meal',post(img));if(!j||!Array.isArray(j.foods)||!j.foods.length)throw new Error('EMPTY');return j.foods.map(normFood)}
async function analyzeNutritionLabelWithAI(img){const j=await callAI('/label',post(img));if(!j||j.calories==null)throw new Error('EMPTY');return normLabel(j)}
async function lookupBarcode(code){const j=await callAI('/barcode?code='+encodeURIComponent(code));if(!j||j.calories==null)throw new Error('NOT_FOUND');return normLabel(j)}
async function readBarcode(file){if(!('BarcodeDetector' in window))throw new Error('NO_DETECTOR');const r=await new BarcodeDetector().detect(await createImageBitmap(file));if(!r.length)throw new Error('NO_CODE');return r[0].rawValue}
function prep(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const go=(mx,q)=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};try{ok({data:go(1024,.8),thumb:go(96,.6)})}catch(e){no(e)}URL.revokeObjectURL(u)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('IMG'))};im.src=u})}
const errMsg=e=>({NO_API:"AI analysis isn't connected yet, so no estimate was made.",NO_DETECTOR:"This browser can't read barcodes from photos.",NO_CODE:'No barcode was found in the photo.',IMG:'This image could not be read.',AbortError:'The request timed out.',NOT_FOUND:'Product not found.',EMPTY:'Nothing could be recognised in this image.'}[e.name==='AbortError'?'AbortError':e.message]||'Something went wrong. Please try again.');

/* ===== helpers ===== */
const tgtW=()=>S.set.water||2.5,wl=r=>+(r.w*.25).toFixed(2);
function slMin(r){const s=r.sl;if(!s||!s.bed||!s.wake)return 0;const a=s.bed.split(':'),b=s.wake.split(':');let m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(m<=0)m+=1440;return m}
const hm=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const mealByTime=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<19?'Snack':'Dinner'};
const opts=(a,v)=>a.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
function score(r,I){const T=S.set,k=sum(r,'kcal'),p=sum(r,'p'),m=slMin(r);
 const nu=k?Math.round(15*Math.max(0,1-Math.abs(k-T.kcal)/T.kcal)+10*Math.min(1,p/T.pro)):0,ac=Math.round(20*Math.min(1,r.steps/I.tgt)+(r.wk>0||r.t.wk?5:0)),hy=Math.round(20*Math.min(1,wl(r)/tgtW())),sl=m?Math.round(15*(m>=420&&m<=540?1:Math.max(0,1-Math.min(Math.abs(m-(m<420?420:540)),240)/240))):0,hb=Math.round(15*dn(r)/5);
 return{tot:nu+ac+hy+sl+hb,parts:[['Nutrition',nu,25],['Activity',ac,25],['Hydration',hy,20],['Sleep',sl,15],['Habits',hb,15]]}}
function insight(r,I){const T=S.set,k=sum(r,'kcal'),p=sum(r,'p'),m=slMin(r),L=[],veg=S.prof.diet==='Vegan'?'tofu, soy or dal':'paneer, curd, dal or tofu';
 if(!k)L.push('No food logged yet — scan or add a meal for a fuller review.');else if(k>T.hi)L.push('Calories are about '+fmt(k-T.hi)+' kcal above your range; keep the next meal light.');else if(k<T.lo)L.push('About '+fmt(T.lo-k)+' kcal left to reach your range.');else L.push('Calories are in your target range.');
 if(k&&p<T.pro*.8)L.push('Protein is behind ('+fmt(p)+' of '+T.pro+' g) — try '+veg+'.');
 if(r.steps<I.tgt*.6)L.push('A short walk would help close the steps gap ('+fmt(I.tgt-r.steps)+' to go).');
 if(wl(r)<tgtW()*.6)L.push('Water is low — have a glass now.');
 if(m&&m<420)L.push('Sleep was under 7 h; aim for an earlier bedtime.');
 return L.slice(0,3).join(' ')}
const pb=(l,v,T,u,c)=>`<div class="mac"><div class="row sp"><span class="mut">${l}</span><span><b style="width:auto">${fmt(v)}</b> <span class="mut">/ ${fmt(T)}${u}</span></span></div><div class="bar"><i class="${c}" style="width:${Math.min(100,v/T*100)}%"></i></div></div>`;
const scanBtn='<button class="scan" data-a="scan" data-v="meal">📸 SCAN MEAL</button>';
const greet=()=>{const h=new Date().getHours();return `<p style="font-size:20px;font-weight:700;margin:-4px 0 10px">${h<12?'Good morning':h<17?'Good afternoon':'Good evening'} 👋</p>`};
function wellCard(r,I,c){const s=score(r,I),T=S.set,k=sum(r,'kcal'),ch=(l,v)=>`<span class="pill" style="font-size:12px">${l} ${v}</span>`;
 return `<section class="card lime" style="margin-top:8px"><div class="row sp"><div><span class="mut">DAILY WELLNESS</span><div class="big" style="font-size:44px;margin-top:6px">${s.tot}<span class="mut" style="font-size:16px;letter-spacing:0"> / 100</span></div></div><div class="mut" style="text-align:right;font-size:12px;max-width:140px">App-generated consistency score, not a medical score</div></div>`+
 (c?`<div class="chips">${ch('Calories',fmt(k)+'/'+fmt(T.kcal))}${ch('Protein',fmt(sum(r,'p'))+'/'+T.pro+'g')}${ch('Water',wl(r)+'/'+tgtW()+'L')}${ch('Steps',fmt(r.steps)+'/'+fmt(I.tgt))}</div>`:s.parts.map(([n,v,m])=>`<div class="row sp mut" style="margin-top:8px;font-size:12px"><span style="width:76px">${n}</span><div class="bar" style="flex:1;margin:0;height:8px;background:#fff"><i style="width:${v/m*100}%"></i></div><span style="width:40px;text-align:right">${v}/${m}</span></div>`).join(''))+'</section>'}
function revCard(r,I){const T=S.set,m=slMin(r),L=(a,b)=>`<div class="row sp mut" style="margin-top:6px"><span>${a}</span><b style="color:#111">${b}</b></div>`;
 return `<section class="card"><div class="row sp"><h2>AI Daily Review</h2><span class="tag">Rule-based</span></div>${L('Calories',fmt(sum(r,'kcal'))+' / '+fmt(T.kcal))}${L('Protein',fmt(sum(r,'p'))+' / '+T.pro+' g')}${L('Steps',fmt(r.steps)+' / '+fmt(I.tgt))}${L('Water',wl(r)+' / '+tgtW()+' L')}${L('Sleep',m?hm(m):'not logged')}<p style="margin-top:10px">${insight(r,I)}</p><p class="mut" style="margin-top:6px;font-size:12px">Generated by simple rules on this device. No AI service is connected.</p></section>`}

  <div class="g2"><section class="card blue" style="margin-top:12px"><span class="mut">Steps</span><div class="n">${fmt(r.steps)}</div><div class="bar" style="background:#fff"><i style="width:${Math.min(100,r.steps/I.tgt*100)}%"></i></div><p class="mut" style="margin-top:6px">Goal ${fmt(I.tgt)}</p></section>
  <section class="card yel" style="margin-top:12px"><span class="mut">Burned</span><div class="n">${fmt(burn(r))} <small>kcal</small></div><p class="mut" style="margin-top:14px">Streak: <b style="color:#111">${streak()} day${streak()==1?'':'s'}</b></p></section></div>${scanBtn}
  <section class="card"><h2>Log activity</h2><div class="g2" style="margin-top:10px"><div><label for="inS">Steps</label><input id="inS" type="number" inputmode="numeric" min="0" value="${r.steps||''}" placeholder="0"></div><div><label for="inW">Workout kcal</label><input id="inW" type="number" inputmode="numeric" min="0" value="${r.wk||''}" placeholder="0"></div></div>
  <div class="chips"><button class="pill" data-a="addS" data-v="500">+500</button><button class="pill" data-a="addS" data-v="1000">+1,000</button><button class="pill" data-a="addS" data-v="2000">+2,000</button><span style="flex:1"></span><button class="btn sm" data-a="saveAct">Save</button></div><p class="mut" style="margin-top:8px">Walking is estimated at ${KPS} kcal per step.</p></section>
  <section class="card"><div class="row sp"><h2>Nutrition</h2><button class="pill" data-a="nav" data-v="food">Log food</button></div>${macros(r)}</section>
  ${waterCard(r)}${sleepCard(r)}
  <div class="row sp" style="margin-top:20px"><h2>Your tasks</h2><span class="pill">${dn(r)}/5</span></div>`+
  tasks.map(([k,t,g])=>`<button class="task ${r.t[k]?'on':''}" data-a="tick" data-v="${k}" aria-pressed="${!!r.t[k]}"><span class="ck">✓</span><span class="tt">${esc(t)}</span><span class="tag">${g}</span></button>`).join('')+
  (/Full Body (A|B)/.test(I.wo)?`<details style="margin-top:10px" class="mut"><summary style="cursor:pointer;color:#111;font-weight:600">See the exercises</summary><p style="margin-top:6px">${/Body A/.test(I.wo)?WA:WB}</p></details>`:'')+revCard(r,I)+bodyCard();
 }else if(view==='food'){
  h=head+`<section class="card lime" style="margin-top:0"><div class="row sp"><h2>TODAY'S NUTRITION</h2><span class="mut">Range ${T.lo}–${T.hi}</span></div><div class="row sp" style="margin-top:10px"><span class="mut">Calories</span><span><b>${fmt(ate)}</b> <span class="mut">/ ${fmt(T.kcal)}</span></span></div>${bar}${pb('Protein',sum(r,'p'),T.pro,' g','p')}${pb('Carbs',sum(r,'c'),T.car,' g','c')}${pb('Fat',sum(r,'f'),T.fat,' g','f')}</section>
  <div class="g2" style="margin-top:12px"><button class="scan" style="margin:0" data-a="scan" data-v="meal">📸 SCAN MEAL</button><button class="scan" style="margin:0;background:#fff;color:#111" data-a="manual">✍️ ADD MANUALLY</button></div>${grouped(r)}
  <section class="card"><h2>Today's plan meals</h2><p class="mut">Tap Add to log one. Values are rough estimates.</p>${M[I.n].map((m,j)=>{const on=r.food.some(f=>f.plan===j);return `<div class="meal"><div><b>${MT[j]} · ~${MK[j]} kcal</b><span>${esc(m)}</span></div><button class="btn sm ${on?'off':''}" data-a="plan" data-v="${j}" ${on?'disabled':''}>${on?'Added ✓':'Add'}</button></div>`}).join('')}</section>
  <section class="card"><h2>Quick add</h2><div class="chips">${Q.map((q,j)=>`<button class="pill" data-a="qf" data-v="${j}">${q[0]} · ${q[1]}</button>`).join('')}</div></section>
  <section class="card pink"><h2>Add something else</h2><div class="g2" style="margin-top:10px"><div style="grid-column:1/-1"><label for="fN">What did you eat?</label><input id="fN" placeholder="e.g. paneer sandwich"></div><div><label for="fM">Meal</label><select id="fM">${MT.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label for="fK">Calories</label><input id="fK" type="number" inputmode="numeric" min="0" placeholder="kcal"></div><div><label for="fC">Carbs (g)</label><input id="fC" type="number" inputmode="numeric" min="0" placeholder="optional"></div><div><label for="fF">Fat (g)</label><input id="fF" type="number" inputmode="numeric" min="0" placeholder="optional"></div><div><label for="fP">Protein (g)</label><input id="fP" type="number" inputmode="numeric" min="0" placeholder="optional"></div><div style="display:flex;align-items:flex-end"><button class="btn" style="width:100%" data-a="addFood">Add to log</button></div></div></section>`;
 }else if(view==='stats'){
  const last=Array.from({length:7},(_,i)=>{const d=new Date(sel);d.setDate(d.getDate()-i);return peek(d)}).filter(Boolean);
  const av=f=>last.length?last.reduce((a,x)=>a+f(x),0)/last.length:0;
  h=`<div class="top"><div class="ttl"><b>Progress</b><small>Tap a bar to open that day</small></div></div>
  <section class="card" style="margin-top:0"><div class="chips" style="margin:0 0 8px">${[['kcal','Eaten'],['steps','Steps'],['burn','Burned']].map(([k,l])=>`<button class="pill ${cm===k?'on':''}" data-a="cm" data-v="${k}">${l}</button>`).join('')}</div>${chart()}</section>
  <div class="g2"><section class="card lime" style="margin-top:12px"><span class="mut">Avg eaten</span><div class="n">${fmt(av(x=>sum({food:x.food||[]},'kcal')))}</div></section><section class="card blue" style="margin-top:12px"><span class="mut">Avg steps</span><div class="n">${fmt(av(x=>x.steps||0))}</div></section><section class="card yel" style="margin-top:0"><span class="mut">Streak</span><div class="n">${streak()} <small>days</small></div></section><section class="card pink" style="margin-top:0"><span class="mut">Days done</span><div class="n">${Object.values(S.days).filter(x=>x.t&&dn(x)>=4).length}<small> / 30</small></div></section></div>
${weekCard()}${bodyCard()}
  <section class="card"><h2>30-day plan</h2><p class="mut">Green = 4+ tasks done · light = some done</p><div class="cal">${Array.from({length:30},(_,i)=>{const d=new Date(2026,9,2+i),x=peek(d),n=x&&x.t?dn(x):0;return `<button class="c ${n>=4?'done':n>0?'part':''} ${key(d)===key(today())?'today':''} ${key(d)===key(sel)?'sel':''}" data-a="go" data-v="${key(d)}" aria-label="Day ${i+1}">${i+1}</button>`}).join('')}</div></section>`;
 }else if(view==='coach'){
  h=head+wellCard(r,I,0)+revCard(r,I)+`<section class="card"><h2>Your targets</h2><p class="mut">${T.kcal} kcal · ${T.pro} g protein · ${T.car} g carbs · ${T.fat} g fat · ${tgtW()} L water · ${fmt(I.tgt)} steps</p><button class="pill" style="margin-top:10px" data-a="nav" data-v="me">Update in Profile</button></section>`;
 }else{
  const w=S.wt[key(sel)]||{};
  h=`<div class="top"><div class="ttl"><b>Profile</b><small>You, body and targets</small></div></div>
  ${profCard()}
  <section class="card"><h2>Body log · ${dl}</h2><p class="mut">Plan: measure on Day 1, 15 and 30.</p><div class="g2" style="margin-top:10px"><div><label for="wK">Weight (kg)</label><input id="wK" type="number" step="0.1" inputmode="decimal" value="${w.kg||''}"></div><div><label for="wW">Waist at navel (cm)</label><input id="wW" type="number" step="0.1" inputmode="decimal" value="${w.waist||''}"></div></div><button class="btn" style="margin-top:12px" data-a="saveWt">Save measurements</button>${wline()}</section>
  <section class="card lime"><h2>Daily targets</h2><div class="g2" style="margin-top:10px">${[['kcal','Calories'],['lo','Range low'],['hi','Range high'],['pro','Protein g'],['car','Carbs g'],['fat','Fat g'],['water','Water L'],['steps','Steps (no plan)']].map(([k,l])=>`<div><label for="s_${k}">${l}</label><input id="s_${k}" type="number" inputmode="decimal" step="any" value="${T[k]}"></div>`).join('')}</div><button class="btn" style="margin-top:12px" data-a="saveSet">Save targets</button></section>
  <section class="card"><h2>Your data</h2><p class="mut">Saved only in this browser on this device.</p><div class="chips"><button class="pill" data-a="exp">⬇ Export data</button><button class="pill" data-a="imp">⬆ Import data</button></div><button class="btn sm ${wipe?'':'off'}" style="margin-top:10px" data-a="wipe">${wipe?'Tap again to confirm reset':'Reset data'}</button></section>`;
 }
 const a=$('#app');a.className=first?'a':'';a.innerHTML=h;first=false;
 $('#nav').innerHTML=[['home','🏠','Home'],['food','🍽️','Nutrition']].map(([v,i,l])=>`<button class="${view===v?'on':''}" data-a="nav" data-v="${v}" aria-label="${l}">${i}<small>${l}</small></button>`).join('')+`<button class="plus" data-a="plus" aria-label="Add food">＋</button>`+[['stats','📊','Progress'],['coach','🤖','Coach'],['me','👤','Profile']].map(([v,i,l])=>`<button class="${view===v?'on':''}" data-a="nav" data-v="${v}" aria-label="${l}">${i}<small>${l}</small></button>`).join('');
}
const num=s=>Math.max(0,+$(s).value||0);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,r=rec(sel),I=info();if(a!=='wipe')wipe=false;
 if(a==='nav'){view=v;window.scrollTo(0,0)}
 else if(a==='day')sel.setDate(sel.getDate()+ +v);
 else if(a==='now')sel=today();
 else if(a==='go'){sel=new Date(v+'T00:00');if(view==='stats'&&b.classList.contains('c')){view='home';window.scrollTo(0,0)}}
 else if(a==='cm')cm=v;
 else if(a==='tick'){r.t[v]=!r.t[v];if(r.t[v]&&dn(r)===5)toast('All tasks done 🎉')}
 else if(a==='addS'){r.steps+= +v;if(r.steps>=I.tgt&&!r.t.steps){r.t.steps=true;toast('Step goal reached 🎉')}}
 else if(a==='saveAct'){r.steps=num('#inS');r.wk=num('#inW');if(r.steps>=I.tgt)r.t.steps=true;toast('Activity saved')}
 else if(a==='water'){r.w=r.w==+v?+v-1:+v;if(wl(r)>=tgtW()){r.t.water=true;toast(tgtW()+' L done 💧')}}
 else if(a==='plan')r.food.push({meal:MT[v],name:M[I.n][v],kcal:MK[v],c:MC[v],f:MF[v],p:MP[v],plan:+v});
 else if(a==='qf'){const q=Q[v];r.food.push({meal:'Snack',name:q[0],kcal:q[1],c:q[2],f:q[3],p:q[4]});toast('Added '+q[0])}
 else if(a==='addFood'){const n=$('#fN').value.trim();if(!n){$('#fN').focus();return}if($('#fK').value===''){$('#fK').focus();return}
  r.food.push({meal:$('#fM').value,name:n,kcal:num('#fK'),c:num('#fC'),f:num('#fF'),p:num('#fP')})}
 else if(a==='del')r.food.splice(+v,1);
 else if(a==='saveWt'){S.wt[key(sel)]={kg:num('#wK'),waist:num('#wW')};toast('Measurements saved')}
 else if(a==='saveSet'){['kcal','lo','hi','pro','car','fat','water','steps'].forEach(k=>{S.set[k]=num('#s_'+k)||S.set[k]});toast('Targets saved')}
 else if(a==='wipe'){if(!wipe){wipe=true}else{S={days:{},wt:{},set:Object.assign({},S.set)};mig();wipe=false;toast('Data erased')}}
 else if(A[a]){if(A[a](v,b,e,r,I)===false)return}
 save();render();
});
const fresh=!Object.keys(S.days).length;render();if(fresh&&!S.prof.done)openSheet({t:'ob'});
</script></body></html>
